<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>TreeCreator</title>
  <style>
    :root{--ink:#18212b;--muted:#647181;--line:#d9e0e7;--bg:#f3f6f8;--panel:#fff;--brand:#075985;--brand2:#0c749f;--soft:#e7f3f8;--danger:#b42318;--warn:#9a6700;--focus:#38bdf8;--shadow:0 12px 32px rgba(18,38,54,.10)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI","Yu Gothic UI","Meiryo",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}
    .app{min-height:100vh;display:grid;grid-template-rows:auto auto 1fr auto}.topbar{display:flex;align-items:center;gap:14px;padding:12px 20px;background:#12364a;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.14)}.brand{font-weight:750;letter-spacing:.02em;white-space:nowrap}.root-wrap{display:flex;align-items:center;gap:8px;flex:1}.root-wrap label{font-size:.875rem;color:#d7e8ef}.root-wrap input{min-width:180px;max-width:580px;width:100%;border:1px solid #7693a1;border-radius:7px;background:#fff;color:var(--ink);padding:7px 10px}.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:10px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
    .btn{border:1px solid #bec9d2;background:#fff;color:var(--ink);border-radius:7px;padding:7px 11px;min-height:38px}.btn:hover:not(:disabled){background:#f3f7f9;border-color:#92a5b4}.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:650}.btn.primary:hover:not(:disabled){background:var(--brand2)}.btn.icon{min-width:38px;padding:6px}.btn.danger{color:var(--danger)}.select{height:38px;border:1px solid #bec9d2;border-radius:7px;background:#fff;padding:0 28px 0 9px}.switch{display:inline-flex;align-items:center;gap:7px;padding:0 4px;white-space:nowrap}.switch input{width:18px;height:18px;accent-color:var(--brand)}.spacer{flex:1}.file-input{display:none}
    .recovery{display:none;align-items:center;gap:10px;padding:9px 20px;background:#fff7df;border-bottom:1px solid #ecd58e}.recovery.show{display:flex}.recovery span{flex:1}.workspace{display:grid;grid-template-columns:minmax(360px,1.08fr) minmax(320px,.92fr);gap:1px;min-height:0;background:var(--line)}.pane{background:var(--panel);min-width:0;display:flex;flex-direction:column}.pane-head{display:flex;align-items:center;gap:10px;min-height:48px;padding:8px 16px;border-bottom:1px solid var(--line)}.pane-head h2{font-size:1rem;margin:0}.pane-head small{color:var(--muted)}.tree-scroll{overflow:auto;padding:10px 12px 32px;flex:1}.tree-empty{padding:40px 20px;text-align:center;color:var(--muted)}
    .tree-row{display:grid;grid-template-columns:26px minmax(150px,1fr) auto;align-items:center;gap:5px;min-height:42px;padding:3px 5px 3px calc(5px + var(--depth)*24px);border-radius:7px;border:1px solid transparent}.tree-row:hover{background:#f5f8fa}.tree-row.selected{background:var(--soft);border-color:#b9dce9}.collapse{border:0;background:transparent;width:26px;height:30px;color:#516170;font-size:15px}.collapse.blank{visibility:hidden}.name-area{display:flex;align-items:center;min-width:0;gap:4px}.prefix{color:#7b8793;font-variant-numeric:tabular-nums;flex:none}.node-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.name-edit{width:100%;min-width:100px;border:1px solid var(--focus);border-radius:5px;padding:5px 7px;outline:2px solid rgba(56,189,248,.2)}.row-actions{display:flex;align-items:center;gap:2px}.row-actions button{border:0;background:transparent;color:#4d5e6d;border-radius:5px;width:30px;height:30px;font-weight:700}.row-actions button:hover{background:#dbeaf0;color:#163b4e}.fixed-badge{font-size:.75rem;color:#735c00;background:#fff4bd;border-radius:4px;padding:1px 5px;margin-left:5px}
    .node-toolbar{display:flex;align-items:center;gap:5px;padding:7px 12px;border-bottom:1px solid var(--line);background:#f8fafb;overflow-x:auto}.node-toolbar .btn{min-height:34px;padding:5px 9px;white-space:nowrap;font-size:.88rem}.text-pane{padding:12px 14px 18px;gap:8px}.text-pane textarea{width:100%;flex:1;min-height:360px;resize:none;border:1px solid #bcc8d1;border-radius:8px;padding:13px 14px;background:#fbfcfd;color:var(--ink);font:15px/1.65 ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;tab-size:2}.text-pane textarea:focus{outline:3px solid rgba(56,189,248,.22);border-color:var(--focus)}.hint{font-size:.82rem;color:var(--muted)}.parse-error{min-height:1.25em;color:var(--danger);font-size:.86rem}
    .status{display:flex;align-items:center;gap:16px;padding:9px 20px;background:#fff;border-top:1px solid var(--line);font-size:.9rem}.status .validation-summary{color:var(--muted)}.status .validation-summary.error{color:var(--danger);font-weight:650}.status .validation-summary.warn{color:var(--warn);font-weight:650}
    dialog{border:0;border-radius:12px;padding:0;width:min(680px,calc(100vw - 28px));box-shadow:var(--shadow);color:var(--ink)}dialog::backdrop{background:rgba(9,26,38,.55)}.dialog-head{display:flex;align-items:center;gap:12px;padding:17px 20px;border-bottom:1px solid var(--line)}.dialog-head h2{font-size:1.1rem;margin:0;flex:1}.dialog-body{padding:18px 20px;max-height:65vh;overflow:auto}.dialog-foot{display:flex;justify-content:flex-end;gap:8px;padding:13px 20px;border-top:1px solid var(--line);background:#f8fafb}.field{display:grid;gap:5px;margin-bottom:16px}.field label{font-weight:650}.field input{border:1px solid #bcc8d1;border-radius:7px;padding:8px 10px}.issues{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:7px}.issue-btn{display:block;text-align:left;width:100%;border:1px solid var(--line);border-left:4px solid var(--warn);background:#fffdf5;border-radius:6px;padding:9px 10px}.issue-btn.error{border-left-color:var(--danger);background:#fff8f7}.issue-title{font-weight:650}.issue-path{display:block;color:var(--muted);font-size:.82rem;margin-top:2px;word-break:break-all}.ok-box{padding:13px;border-radius:7px;background:#edf8f3;color:#17613c}.confirm-copy{margin:0}.toast{position:fixed;right:20px;bottom:70px;background:#172c39;color:#fff;padding:10px 14px;border-radius:7px;box-shadow:var(--shadow);opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:none}
    .mobile-tabs{display:none}.kbd{border:1px solid #c8d1d8;border-bottom-width:2px;border-radius:4px;background:#fff;padding:0 5px;font-size:.78rem;color:#536170}
    @media(max-width:820px){.topbar{align-items:flex-start;flex-direction:column;padding:12px}.root-wrap{width:100%}.toolbar{padding:8px 12px}.toolbar .spacer{display:none}.workspace{display:block}.mobile-tabs{display:flex;background:#fff;border-bottom:1px solid var(--line);padding:7px 12px;gap:6px}.mobile-tabs button{flex:1}.pane{display:none;height:calc(100vh - 245px);min-height:460px}.pane.active{display:flex}.status{padding:8px 12px;flex-wrap:wrap}.status .spacer{display:block}.row-actions .secondary-action{display:none}.tree-row{padding-left:calc(2px + var(--depth)*18px)}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
<main class="app">
  <header class="topbar">
    <div class="brand">TreeCreator</div>
    <div class="root-wrap"><label for="rootName">ルート名</label><input id="rootName" maxlength="120" value="R08_○○案件"></div>
  </header>
  <div>
    <section class="toolbar" aria-label="操作">
      <select id="templateSelect" class="select" aria-label="テンプレート"><option value="empty">空</option><option value="minimum">最小</option><option value="standard" selected>標準</option></select>
      <button id="applyTemplate" class="btn">テンプレート適用</button>
      <button id="loadJson" class="btn">JSON読込</button><input id="jsonFile" class="file-input" type="file" accept="application/json,.json">
      <button id="saveJson" class="btn">JSON保存</button>
      <span class="spacer"></span>
      <label class="switch"><input id="numbering" type="checkbox" checked>採番</label>
      <button id="undo" class="btn icon" title="元に戻す (Ctrl+Z)" aria-label="元に戻す">↶</button>
      <button id="redo" class="btn icon" title="やり直す (Ctrl+Y)" aria-label="やり直す">↷</button>
      <button id="openExport" class="btn primary">ZIPで出力</button>
    </section>
    <section id="recovery" class="recovery" role="status"><span>前回、保存せずに終了した編集があります。</span><button id="restoreDraft" class="btn">復元</button><button id="discardDraft" class="btn">破棄</button></section>
    <nav class="mobile-tabs" aria-label="編集方法"><button class="btn primary" data-pane="treePane">ツリー</button><button class="btn" data-pane="textPane">テキスト</button></nav>
  </div>
  <section class="workspace">
    <section id="treePane" class="pane active" aria-labelledby="treeTitle">
      <header class="pane-head"><h2 id="treeTitle">フォルダ構造</h2><small>選択してボタンまたはキーで編集</small><span class="spacer"></span><button id="addRoot" class="btn">＋ 最上位</button></header>
      <div id="nodeToolbar" class="node-toolbar" aria-label="選択中フォルダの操作">
        <button class="btn" data-op="rename">名前変更</button><button class="btn" data-op="sibling">＋ 下に追加</button><button class="btn" data-op="child">＋ 子</button><button class="btn" data-op="up">↑ 上へ</button><button class="btn" data-op="down">↓ 下へ</button><button class="btn" data-op="indent">→ 字下げ</button><button class="btn" data-op="outdent">← 字上げ</button><button class="btn" data-op="fixed">固定番号</button><button class="btn danger" data-op="delete">削除</button>
      </div>
      <div id="tree" class="tree-scroll" role="tree" aria-label="フォルダ構造"></div>
    </section>
    <section id="textPane" class="pane text-pane" aria-labelledby="textTitle">
      <header class="pane-head"><h2 id="textTitle">テキスト編集</h2><small>2空白またはTabで階層化</small></header>
      <textarea id="textEditor" spellcheck="false" aria-describedby="textHint parseError"></textarea>
      <div id="textHint" class="hint">固定番号は末尾に <code>[99]</code> と記述します。変更はツリーへ反映されます。</div>
      <div id="parseError" class="parse-error" role="alert"></div>
    </section>
  </section>
  <footer class="status"><span id="stats"></span><span id="validationSummary" class="validation-summary"></span><span class="spacer"></span><span class="hint"><span class="kbd">Enter</span> 追加　<span class="kbd">Tab</span> 字下げ　<span class="kbd">Alt+↑↓</span> 移動　<span class="kbd">F2</span> 名前変更</span></footer>
</main>

<dialog id="exportDialog" aria-labelledby="exportTitle">
  <header class="dialog-head"><h2 id="exportTitle">ZIP出力前の確認</h2><button id="closeExportX" class="btn icon" aria-label="閉じる">×</button></header>
  <div class="dialog-body">
    <div class="field"><label for="baseLength">保存先までの基点パス長（文字）</label><input id="baseLength" type="number" min="0" max="240" value="100"><small class="hint">例：\\サーバ名\共有名\部\課\ までのおおよその長さ。既定値は100文字です。</small></div>
    <div id="exportOverview"></div><ul id="issueList" class="issues"></ul>
  </div>
  <footer class="dialog-foot"><button id="closeExport" class="btn">戻る</button><button id="downloadZip" class="btn primary">ZIPを保存</button></footer>
</dialog>

<dialog id="confirmDialog" aria-labelledby="confirmTitle">
  <header class="dialog-head"><h2 id="confirmTitle">確認</h2></header><div class="dialog-body"><p id="confirmMessage" class="confirm-copy"></p></div>
  <footer class="dialog-foot"><button id="confirmCancel" class="btn">キャンセル</button><button id="confirmOk" class="btn danger">続ける</button></footer>
</dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), STORAGE_KEY='treecreator-draft-v1', MAX_HISTORY=50;
const TEMPLATES={
 empty:[],
 minimum:[n('資料'),n('作業'),n('成果')],
 standard:[n('資料',[n('受領'),n('作業用')]),n('検討'),n('実施'),n('成果'),n('参考',[],99)]
};
let state={version:1,rootName:'R08_○○案件',numbering:{enabled:true,digits:2},tree:clone(TEMPLATES.standard)};
let history=[],historyIndex=-1,selectedId=null,editingId=null,textTimer=null,toastTimer=null,confirmAction=null,draftAtStart=null;

function uid(){return globalThis.crypto?.randomUUID?.()||'n'+Date.now().toString(36)+Math.random().toString(36).slice(2)}
function n(name,children=[],fixedNumber=null){return{id:uid(),name,fixedNumber,collapsed:false,children}}
function clone(value){return JSON.parse(JSON.stringify(value))}
function ordered(nodes){return [...nodes.filter(x=>x.fixedNumber==null),...nodes.filter(x=>x.fixedNumber!=null).sort((a,b)=>a.fixedNumber-b.fixedNumber)]}
function snapshot(){return clone(state)}
function pushHistory(){const snap=snapshot();if(historyIndex>=0&&JSON.stringify(history[historyIndex])===JSON.stringify(snap))return;history=history.slice(0,historyIndex+1);history.push(snap);if(history.length>MAX_HISTORY)history.shift();historyIndex=history.length-1;updateHistoryButtons()}
function restoreHistory(i){if(i<0||i>=history.length)return;clearTimeout(textTimer);historyIndex=i;state=clone(history[i]);selectedId=null;editingId=null;syncAll();updateHistoryButtons()}
function updateHistoryButtons(){$('#undo').disabled=historyIndex<=0;$('#redo').disabled=historyIndex>=history.length-1}
function commit(mutator,{text=true}={}){mutator();state.tree=normalizeOrder(state.tree);pushHistory();syncAll(text);saveDraft()}
function normalizeOrder(nodes){return ordered(nodes).map(x=>({...x,children:normalizeOrder(x.children||[])}))}
function walk(nodes,fn,path=[]){for(let i=0;i<nodes.length;i++){const node=nodes[i],p=[...path,node];if(fn(node,nodes,i,p)===false)return false;if(walk(node.children||[],fn,p)===false)return false}return true}
function findNode(id){let found=null;walk(state.tree,(node,parent,index,path)=>{if(node.id===id){found={node,parent,index,path};return false}});return found}
function findParentList(id){let result=null;const scan=(nodes,parentNode=null)=>{for(let i=0;i<nodes.length;i++){if(nodes[i].id===id){result={list:nodes,index:i,parentNode};return true}if(scan(nodes[i].children,nodes[i]))return true}return false};scan(state.tree);return result}
function displayPrefix(node,list){if(!state.numbering.enabled)return'';if(node.fixedNumber!=null)return String(node.fixedNumber).padStart(2,'0')+'_';let count=0;for(const item of list){if(item.fixedNumber==null)count++;if(item===node)break}return String(count).padStart(state.numbering.digits,'0')+'_'}
function renderTree(){const root=$('#tree');root.textContent='';updateNodeToolbar();if(!state.tree.length){root.innerHTML='<div class="tree-empty">まだフォルダがありません。<br>「＋ 最上位」またはテキスト編集から追加できます。</div>';return}const frag=document.createDocumentFragment();const render=(nodes,depth)=>{for(const node of ordered(nodes)){const row=document.createElement('div');row.className='tree-row'+(selectedId===node.id?' selected':'');row.style.setProperty('--depth',depth);row.dataset.id=node.id;row.setAttribute('role','treeitem');row.setAttribute('aria-level',String(depth+1));row.tabIndex=selectedId===node.id?0:-1;
 const collapse=document.createElement('button');collapse.className='collapse'+(node.children.length?'':' blank');collapse.textContent=node.collapsed?'▸':'▾';collapse.title=node.collapsed?'展開':'折りたたむ';collapse.setAttribute('aria-label',collapse.title);collapse.onclick=e=>{e.stopPropagation();commit(()=>node.collapsed=!node.collapsed)};row.append(collapse);
 const area=document.createElement('div');area.className='name-area';const prefix=document.createElement('span');prefix.className='prefix';prefix.textContent=displayPrefix(node,nodes);area.append(prefix);
 if(editingId===node.id){const input=document.createElement('input');input.className='name-edit';input.value=node.name;input.setAttribute('aria-label','フォルダ名');input.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();finishEdit(node,input.value)}if(e.key==='Escape'){editingId=null;renderTree()}};input.onblur=()=>{if(editingId===node.id)finishEdit(node,input.value)};area.append(input);queueMicrotask(()=>{input.focus();input.select()})}else{const name=document.createElement('span');name.className='node-name';name.textContent=node.name||'（空の名前）';area.append(name);if(node.fixedNumber!=null){const badge=document.createElement('span');badge.className='fixed-badge';badge.textContent='固定 '+node.fixedNumber;area.append(badge)}}row.append(area);
 const actions=document.createElement('div');actions.className='row-actions';actions.append(actionButton('＋','子を追加',()=>addChild(node.id)),actionButton('✎','名前変更',()=>startEdit(node.id)));row.append(actions);row.onclick=()=>selectRow(node.id);row.ondblclick=e=>{if(!e.target.closest('button'))startEdit(node.id)};frag.append(row);if(!node.collapsed)render(node.children,depth+1)}};render(state.tree,0);root.append(frag)}
function actionButton(label,title,fn){const b=document.createElement('button');b.type='button';b.textContent=label;b.title=title;b.setAttribute('aria-label',title);b.onclick=e=>{e.stopPropagation();fn()};return b}
function selectRow(id){selectedId=id;renderTree();queueMicrotask(()=>document.querySelector(`.tree-row[data-id="${CSS.escape(id)}"]`)?.focus())}
function startEdit(id){selectedId=id;editingId=id;renderTree()}
function finishEdit(node,value){editingId=null;if(value===node.name){renderTree();return}commit(()=>node.name=value)}
function addRoot(){const node=n('新しいフォルダ');commit(()=>state.tree.push(node));startEdit(node.id)}
function addChild(id){const f=findNode(id);if(!f)return;const child=n('新しいフォルダ');commit(()=>{f.node.children.push(child);f.node.collapsed=false});startEdit(child.id)}
function addSibling(id){const f=findParentList(id);if(!f)return;const node=n('新しいフォルダ');commit(()=>f.list.splice(f.index+1,0,node));startEdit(node.id)}
function removeNode(id){const f=findParentList(id);if(!f)return;const count=countNodes([f.list[f.index]]);askConfirm(`「${f.list[f.index].name}」${count>1?'と配下の'+(count-1)+'フォルダ':''}を削除します。`,()=>commit(()=>{f.list.splice(f.index,1);selectedId=null}))}
function move(id,delta){const f=findParentList(id);if(!f)return;const target=f.index+delta;if(target<0||target>=f.list.length)return;commit(()=>{const [x]=f.list.splice(f.index,1);f.list.splice(target,0,x)})}
function indent(id){const f=findParentList(id);if(!f||f.index===0)return;const node=f.list[f.index],prev=f.list[f.index-1];commit(()=>{f.list.splice(f.index,1);prev.children.push(node);prev.collapsed=false})}
function outdent(id){const f=findParentList(id);if(!f||!f.parentNode)return;const parentLoc=findParentList(f.parentNode.id);if(!parentLoc)return;commit(()=>{const [node]=f.list.splice(f.index,1);parentLoc.list.splice(parentLoc.index+1,0,node)})}
function setFixed(id){const f=findNode(id);if(!f)return;const raw=prompt('固定番号を入力してください。空欄で解除します。',f.node.fixedNumber??'');if(raw===null)return;if(raw.trim()===''){commit(()=>f.node.fixedNumber=null);return}const num=Number(raw);if(!Number.isInteger(num)||num<0||num>99){showToast('固定番号は0～99の整数で入力してください。');return}commit(()=>f.node.fixedNumber=num)}
function updateNodeToolbar(){document.querySelectorAll('#nodeToolbar button').forEach(b=>b.disabled=!selectedId)}

function serializeText(){const lines=[];const rec=(nodes,d)=>ordered(nodes).forEach(node=>{lines.push('  '.repeat(d)+node.name+(node.fixedNumber!=null?` [${String(node.fixedNumber).padStart(2,'0')}]`:''));rec(node.children,d+1)});rec(state.tree,0);return lines.join('\n')}
function parseText(text){const roots=[],stack=[];const lines=text.replace(/\r/g,'').split('\n');for(let lineNo=0;lineNo<lines.length;lineNo++){const raw=lines[lineNo];if(!raw.trim())continue;const lead=raw.match(/^[\t ]*/)[0];let depth=0,spaces=0;for(const ch of lead){if(ch==='\t'){if(spaces%2)throw new Error(`${lineNo+1}行目: 半角空白は2個単位にしてください`);depth+=spaces/2+1;spaces=0}else spaces++}if(spaces%2)throw new Error(`${lineNo+1}行目: 半角空白は2個単位にしてください`);depth+=spaces/2;if(depth>stack.length)throw new Error(`${lineNo+1}行目: 階層を一度に2段以上深くできません`);let name=raw.slice(lead.length).trimEnd(),fixedNumber=null;const m=name.match(/\s\[(\d{1,2})\]$/);if(m){fixedNumber=Number(m[1]);name=name.slice(0,m.index).trimEnd()}const node=n(name,[],fixedNumber);if(depth===0)roots.push(node);else stack[depth-1].children.push(node);stack[depth]=node;stack.length=depth+1}return normalizeOrder(roots)}
function onTextInput(){clearTimeout(textTimer);textTimer=setTimeout(()=>{try{const tree=parseText($('#textEditor').value);$('#parseError').textContent='';commit(()=>state.tree=tree,{text:false})}catch(err){$('#parseError').textContent=err.message}},260)}

function countNodes(nodes){return nodes.reduce((sum,x)=>sum+1+countNodes(x.children),0)}
function maxDepth(nodes,d=1){return nodes.reduce((m,x)=>Math.max(m,d,maxDepth(x.children,d+1)),0)}
function effectiveName(node,list){return displayPrefix(node,list)+node.name}
function validation(baseLength=100){const issues=[];const invalid=/[\\/:*?"<>|\x00-\x1F]/;const reserved=/^(con|prn|aux|nul|com[1-9]|lpt[1-9])(?:\..*)?$/i;const checkName=(name,path,id)=>{if(!name||!name.replace(/[\s　]/g,''))issues.push(issue('error','名前が空です',path,id));if(invalid.test(name))issues.push(issue('error','Windowsで使えない文字が含まれています',path,id));if(/[ .]$/.test(name))issues.push(issue('error','末尾に空白またはピリオドがあります',path,id));if(reserved.test(name))issues.push(issue('error','Windowsの予約名です',path,id))};checkName(state.rootName,state.rootName,null);const rootRendered=state.rootName;const scan=(nodes,parts=[])=>{const seen=new Map();for(const node of ordered(nodes)){const rendered=effectiveName(node,nodes),key=node.name.normalize('NFKC').toLocaleLowerCase('ja-JP');if(seen.has(key))issues.push(issue('error','同じ階層に重複する名前があります',[...parts,rendered].join(' / '),node.id));else seen.set(key,node.id);const path=[rootRendered,...parts,rendered].join('\\');checkName(node.name,path,node.id);const estimated=Number(baseLength||0)+1+path.length;if(estimated>=260)issues.push(issue('error',`推定パス長が${estimated}文字です（260文字以上）`,path,node.id));else if(estimated>=240)issues.push(issue('warn',`推定パス長が${estimated}文字です（240文字以上）`,path,node.id));scan(node.children,[...parts,rendered])}};scan(state.tree);return issues}
function issue(level,title,path,id){return{level,title,path,id}}
function updateStatus(){const total=countNodes(state.tree),depth=maxDepth(state.tree);$('#stats').textContent=`${total}フォルダ / 最大${depth||0}階層`;const issues=validation(Number($('#baseLength').value));const errors=issues.filter(x=>x.level==='error').length,warns=issues.length-errors;const el=$('#validationSummary');el.className='validation-summary '+(errors?'error':warns?'warn':'');el.textContent=errors?`エラー ${errors}件`:warns?`警告 ${warns}件`:'出力できます';$('#openExport').disabled=!!$('#parseError').textContent}
function openExport(){renderExport();$('#exportDialog').showModal()}
function renderExport(){const issues=validation(Number($('#baseLength').value)),errors=issues.filter(x=>x.level==='error').length;$('#exportOverview').innerHTML=issues.length?`<strong>${errors?'修正が必要です':'警告があります'}</strong><div class="hint">項目を選ぶと該当フォルダへ移動します。</div>`:'<div class="ok-box">問題は見つかりませんでした。ZIPを保存できます。</div>';const list=$('#issueList');list.textContent='';issues.forEach(x=>{const li=document.createElement('li'),b=document.createElement('button');b.className='issue-btn '+x.level;b.innerHTML=`<span class="issue-title">${x.level==='error'?'エラー':'警告'}：${escapeHtml(x.title)}</span><span class="issue-path">${escapeHtml(x.path)}</span>`;b.onclick=()=>jumpTo(x.id);li.append(b);list.append(li)});$('#downloadZip').disabled=errors>0||!state.rootName;updateStatus()}
function jumpTo(id){$('#exportDialog').close();if(id){selectedId=id;let f=findNode(id);if(f)f.path.slice(0,-1).forEach(x=>x.collapsed=false);renderTree();queueMicrotask(()=>document.querySelector(`.tree-row[data-id="${CSS.escape(id)}"]`)?.scrollIntoView({block:'center'}))}else{$('#rootName').focus()}}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function zipEntries(){const result=[],root=state.rootName+'/';result.push(root);const rec=(nodes,prefix)=>ordered(nodes).forEach(node=>{const path=prefix+effectiveName(node,nodes)+'/';result.push(path);rec(node.children,path)});rec(state.tree,root);return result}
function makeZip(names){const enc=new TextEncoder(),locals=[],centrals=[];let offset=0;const now=new Date(),year=Math.max(1980,now.getFullYear()),dosDate=((year-1980)<<9)|((now.getMonth()+1)<<5)|now.getDate(),dosTime=(now.getHours()<<11)|(now.getMinutes()<<5)|(now.getSeconds()>>1);for(const name of names){const bytes=enc.encode(name),local=new Uint8Array(30+bytes.length),lv=new DataView(local.buffer);lv.setUint32(0,0x04034b50,true);lv.setUint16(4,20,true);lv.setUint16(6,0x0800,true);lv.setUint16(8,0,true);lv.setUint16(10,dosTime,true);lv.setUint16(12,dosDate,true);lv.setUint16(26,bytes.length,true);local.set(bytes,30);locals.push(local);const central=new Uint8Array(46+bytes.length),cv=new DataView(central.buffer);cv.setUint32(0,0x02014b50,true);cv.setUint16(4,20,true);cv.setUint16(6,20,true);cv.setUint16(8,0x0800,true);cv.setUint16(10,0,true);cv.setUint16(12,dosTime,true);cv.setUint16(14,dosDate,true);cv.setUint16(28,bytes.length,true);cv.setUint32(38,0x10,true);cv.setUint32(42,offset,true);central.set(bytes,46);centrals.push(central);offset+=local.length}const centralSize=centrals.reduce((s,x)=>s+x.length,0),eocd=new Uint8Array(22),ev=new DataView(eocd.buffer);ev.setUint32(0,0x06054b50,true);ev.setUint16(8,names.length,true);ev.setUint16(10,names.length,true);ev.setUint32(12,centralSize,true);ev.setUint32(16,offset,true);return new Blob([...locals,...centrals,eocd],{type:'application/zip'})}
function downloadZip(){const blob=makeZip(zipEntries()),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=safeFilename(state.rootName)+'.zip';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);$('#exportDialog').close();showToast('ZIPを保存しました')}
function safeFilename(name){return(name||'folders').replace(/[\\/:*?"<>|\x00-\x1F]/g,'_').replace(/[ .]+$/,'').slice(0,100)||'folders'}

function exportJson(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=safeFilename(state.rootName)+'.tree.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);showToast('JSONを保存しました')}
function loadJsonFile(file){if(!file)return;if(file.size>2_000_000){showToast('2MB以下のJSONを選んでください');return}const reader=new FileReader();reader.onload=()=>{try{const loaded=sanitizeState(JSON.parse(reader.result));state=loaded;selectedId=null;history=[];historyIndex=-1;pushHistory();syncAll();saveDraft();showToast('JSONを読み込みました')}catch(err){showToast('JSONを読み込めません: '+err.message)}};reader.readAsText(file)}
function sanitizeState(raw){if(!raw||raw.version!==1||typeof raw.rootName!=='string'||!Array.isArray(raw.tree))throw new Error('対応していない形式です');let total=0;const clean=nodes=>nodes.map(x=>{if(!x||typeof x.name!=='string'||!Array.isArray(x.children))throw new Error('フォルダ構造が不正です');if(++total>5000)throw new Error('フォルダ数が多すぎます');return{id:typeof x.id==='string'&&x.id?x.id:uid(),name:x.name.slice(0,255),fixedNumber:Number.isInteger(x.fixedNumber)&&x.fixedNumber>=0&&x.fixedNumber<=99?x.fixedNumber:null,collapsed:!!x.collapsed,children:clean(x.children)}});return{version:1,rootName:raw.rootName.slice(0,120),numbering:{enabled:raw.numbering?.enabled!==false,digits:2},tree:normalizeOrder(clean(raw.tree))}}
function saveDraft(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({...state,savedAt:new Date().toISOString()}))}catch{}}
function initRecovery(){try{const raw=localStorage.getItem(STORAGE_KEY);if(raw){draftAtStart=sanitizeState(JSON.parse(raw));$('#recovery').classList.add('show')}}catch{localStorage.removeItem(STORAGE_KEY)}}
function applyTemplate(){const key=$('#templateSelect').value,apply=()=>{state={version:1,rootName:state.rootName,numbering:{...state.numbering},tree:clone(TEMPLATES[key])};history=[];historyIndex=-1;selectedId=null;pushHistory();syncAll();saveDraft()};if(state.tree.length)askConfirm('現在のフォルダ構造を選択したテンプレートで置き換えます。',apply);else apply()}
function askConfirm(message,action){confirmAction=action;$('#confirmMessage').textContent=message;$('#confirmDialog').showModal()}
function showToast(message){const el=$('#toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2600)}
function syncAll(updateText=true){$('#rootName').value=state.rootName;$('#numbering').checked=state.numbering.enabled;renderTree();if(updateText)$('#textEditor').value=serializeText();updateStatus()}

$('#rootName').addEventListener('change',e=>commit(()=>state.rootName=e.target.value));$('#rootName').addEventListener('input',e=>{state.rootName=e.target.value;updateStatus();saveDraft()});$('#rootName').addEventListener('blur',()=>pushHistory());
$('#numbering').onchange=e=>commit(()=>state.numbering.enabled=e.target.checked);$('#applyTemplate').onclick=applyTemplate;$('#addRoot').onclick=addRoot;$('#undo').onclick=()=>restoreHistory(historyIndex-1);$('#redo').onclick=()=>restoreHistory(historyIndex+1);$('#textEditor').addEventListener('input',onTextInput);$('#textEditor').addEventListener('keydown',e=>{if(e.key==='Tab'){e.preventDefault();const t=e.target,start=t.selectionStart,end=t.selectionEnd;t.setRangeText('  ',start,end,'end');t.dispatchEvent(new Event('input'))}});
document.querySelectorAll('#nodeToolbar button').forEach(b=>b.onclick=()=>{if(!selectedId)return;({rename:()=>startEdit(selectedId),sibling:()=>addSibling(selectedId),child:()=>addChild(selectedId),up:()=>move(selectedId,-1),down:()=>move(selectedId,1),indent:()=>indent(selectedId),outdent:()=>outdent(selectedId),fixed:()=>setFixed(selectedId),delete:()=>removeNode(selectedId)})[b.dataset.op]?.()});
$('#loadJson').onclick=()=>$('#jsonFile').click();$('#jsonFile').onchange=e=>{loadJsonFile(e.target.files[0]);e.target.value=''};$('#saveJson').onclick=exportJson;$('#openExport').onclick=openExport;$('#closeExport').onclick=$('#closeExportX').onclick=()=>$('#exportDialog').close();$('#baseLength').oninput=renderExport;$('#downloadZip').onclick=downloadZip;
$('#confirmCancel').onclick=()=>{confirmAction=null;$('#confirmDialog').close()};$('#confirmOk').onclick=()=>{const fn=confirmAction;confirmAction=null;$('#confirmDialog').close();fn?.()};
$('#restoreDraft').onclick=()=>{state=clone(draftAtStart);history=[];historyIndex=-1;pushHistory();syncAll();$('#recovery').classList.remove('show');showToast('前回の編集を復元しました')};$('#discardDraft').onclick=()=>{$('#recovery').classList.remove('show');localStorage.removeItem(STORAGE_KEY);draftAtStart=null};
document.querySelectorAll('.mobile-tabs button').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('.mobile-tabs button').forEach(x=>x.classList.toggle('primary',x===btn));document.querySelectorAll('.pane').forEach(x=>x.classList.toggle('active',x.id===btn.dataset.pane))});
document.addEventListener('keydown',e=>{const tag=document.activeElement?.tagName;if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&e.key.toLowerCase()==='z'){e.preventDefault();restoreHistory(historyIndex-1);return}if(((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y')||((e.ctrlKey||e.metaKey)&&e.shiftKey&&e.key.toLowerCase()==='z')){e.preventDefault();restoreHistory(historyIndex+1);return}if(!selectedId||['INPUT','TEXTAREA','SELECT'].includes(tag)||document.querySelector('dialog[open]'))return;if(e.key==='Enter'){e.preventDefault();addSibling(selectedId)}else if(e.key==='Tab'){e.preventDefault();e.shiftKey?outdent(selectedId):indent(selectedId)}else if(e.altKey&&e.key==='ArrowUp'){e.preventDefault();move(selectedId,-1)}else if(e.altKey&&e.key==='ArrowDown'){e.preventDefault();move(selectedId,1)}else if(e.key==='F2'){e.preventDefault();startEdit(selectedId)}else if(e.key==='Delete'){e.preventDefault();removeNode(selectedId)}});
window.addEventListener('beforeunload',saveDraft);initRecovery();pushHistory();syncAll();
})();
</script>
</body>
